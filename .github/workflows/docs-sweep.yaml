name: Kaseki Docs Sweep

on:
  schedule:
    - cron: '0 5 * * 4'
  workflow_dispatch:
    inputs:
      validation_profile:
        description: Validation to run in the Kaseki workspace
        required: true
        default: docs
        type: choice
        options:
          - docs

run-name: >-
  Docs sweep · ${{ github.repository }}@${{ github.sha }}

permissions:
  contents: read

concurrency:
  group: kaseki-docs-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  docs_sweep:
    name: Run Kaseki documentation sweep
    environment: kaseki-agent
    runs-on: ubuntu-24.04

    # Kaseki permits a three-hour execution window; leave sufficient time for
    # queueing, controller retries, and a final status read before Actions ends.
    timeout-minutes: 360

    env:
      # These environment-scoped variables and the API token form one protected
      # trust boundary. Do not define fallbacks at repository or organization scope.
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}
      KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
      ALLOWLIST: README.md,docs/**/*.md
      TASK_DESCRIPTION: Keep README.md and docs/ accurate against the current implementation.
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REF: ${{ github.sha }}
      VALIDATION_COMMAND: ${{ github.event_name == 'schedule' && 'npm run validate:docs' || (inputs.validation_profile == 'docs' && 'npm run validate:docs' || inputs.validation_profile == 'lint' && 'npm run lint' || '') }}

    steps:
      - name: Validate controller URL
        shell: bash
        run: |
          set -euo pipefail
          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"
          [[ "$KASEKI_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || {
            echo "::error::KASEKI_BASE_URL must be an HTTPS origin without a path, query, or fragment."
            exit 1
          }

      - name: Verify controller health
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 20 --max-filesize 1048576 \
            --output "$response_file" \
            "$KASEKI_BASE_URL/health"
          jq -e '.status == "healthy"' "$response_file" >/dev/null
          echo 'Kaseki controller is healthy.'

      - name: Verify controller readiness
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 20 --max-filesize 1048576 \
            --output "$response_file" \
            "$KASEKI_BASE_URL/ready"
          jq -e '.status == "ready"' "$response_file" >/dev/null
          echo 'Kaseki controller is ready.'

      - name: Verify gateway connectivity and authentication
        shell: bash
        run: |
          set -euo pipefail
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 --max-filesize 1048576 \
            --output "$response_file" \
            --header "Authorization: Bearer $KASEKI_API_TOKEN" \
            "$KASEKI_BASE_URL/api/gateway-test?stage=1"
          jq -e '.status == "ok"' "$response_file" >/dev/null
          echo 'Kaseki gateway authentication succeeded.'

      - name: Verify Kaseki publication readiness
        shell: bash
        run: |
          set -euo pipefail
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 --max-filesize 1048576 \
            --output "$response_file" \
            --header "Authorization: Bearer $KASEKI_API_TOKEN" \
            "$KASEKI_BASE_URL/api/preflight"
          jq -e '.status == "ok"' "$response_file" >/dev/null
          echo 'Kaseki publication readiness succeeded.'

      - name: Submit documentation sweep
        id: submit
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"

          # GITHUB_RUN_ID remains stable when a workflow run is re-run. Kaseki
          # therefore replays the original task instead of enqueueing another one.
          digest="$(printf '%s' "$GITHUB_REPOSITORY:$GITHUB_WORKFLOW:$GITHUB_RUN_ID" | shasum -a 256 | awk '{print $1}')"
          idempotency_key="${digest:0:8}-${digest:8:4}-4${digest:13:3}-8${digest:17:3}-${digest:20:12}"

          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg taskDescription "$TASK_DESCRIPTION" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              --arg idempotencyKey "$idempotency_key" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                idempotencyKey: $idempotencyKey,
                taskMode: "patch",
                publishMode: "pr",
                timeoutSeconds: 10800,
                changedFilesAllowlist: (
                  $allowlist
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))
                ),
                validationCommands: (
                  if $validationCommand == "" then []
                  else [$validationCommand]
                  end
                ),
                goalCheck: {
                  enabled: true,
                  maxRetries: 1
                },
                scouting: {
                  enabled: false
                },
                taskPrompt: (
                  $taskDescription
                  + "\n\nPerform the documentation sweep for this repository. "
                  + "First read repository instructions, then inspect the current "
                  + "implementation and compare it against README.md and documentation "
                  + "under docs/. Update documentation only where inaccurate, incomplete, "
                  + "or stale. Do not modify application code, tests, configuration, "
                  + "dependencies, lockfiles, CI workflows, or generated files. "
                  + "Do not invent behavior. Avoid cosmetic rewrites. Before finishing, "
                  + "review the diff to confirm it contains documentation-only changes. "
                  + "If documentation is already accurate, make no changes and do not "
                  + "open a pull request."
                )
              }'
          )"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            curl --silent --show-error \
              --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 --max-filesize 1048576 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST "$KASEKI_BASE_URL/api/runs" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload"
          )"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "::error title=Kaseki submission failed::Kaseki returned HTTP $http_status"

            {
              echo "## Kaseki submission failed"
              echo
              echo "Kaseki returned HTTP \`$http_status\`."
              echo
              echo "The controller response body is intentionally omitted to avoid logging sensitive data."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          run_id="$(jq -er '.id | if type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$") then . else error("invalid Kaseki run id") end' "$response_file")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Publish submission details
        run: |
          {
            echo "## Kaseki submission"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | \`$REPO_URL\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Mode | \`patch\` |"
            echo "| Timeout | 3 hours |"
            echo "| Kaseki run | \`${{ steps.submit.outputs.run_id }}\` |"
            echo
            echo "### Allowed paths"
            echo '```text'
            echo "$ALLOWLIST" | tr ',' '\n'
            echo '```'
            echo
            echo "### Task description"
            echo "$TASK_DESCRIPTION"
            echo
            echo "### Validation"
            echo '```text'
            echo "${VALIDATION_COMMAND:-No validation command configured}"
            echo '```'
            echo
            echo "Monitor the run: $KASEKI_BASE_URL/ui"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Kaseki completion
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 21000))

          while (( SECONDS < deadline )); do
            response_file="$(mktemp)"
            trap 'rm -f "$response_file"' EXIT

            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 --max-filesize 1048576 \
              --output "$response_file" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              "$KASEKI_BASE_URL/api/runs/$RUN_ID/status"
            run_status="$(jq -er '.status | select(type == "string")' "$response_file")"

            case "$run_status" in
              completed)
                exit_code="$(jq -er '.exitCode // 0 | select(type == "number")' "$response_file")"
                if [[ "$exit_code" == 0 ]]; then
                  echo "Kaseki run $RUN_ID completed successfully."
                  exit 0
                fi
                echo "::error::Kaseki run $RUN_ID completed with exit code $exit_code."
                exit 1
                ;;
              failed|cancelled)
                echo "::error::Kaseki run $RUN_ID ended with status $run_status."
                exit 1
                ;;
              queued|running)
                echo "Kaseki run $RUN_ID is $run_status; checking again in 60 seconds."
                ;;
              *)
                echo "::error::Kaseki run $RUN_ID returned unexpected status $run_status."
                exit 1
                ;;
            esac

            rm -f "$response_file"
            trap - EXIT
            sleep 60
          done

          echo "::error::Kaseki run $RUN_ID did not complete within 350 minutes."
          exit 1
