name: Documentation links

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-links-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --max-retries 2
            --retry-wait-time 2
            --timeout 20
            --exclude-loopback
            README.md
            SETUP.md
            CONTRIBUTING.md
            go/README.md
            workers/matmetrics-auth/README.md
            docs/*.md
