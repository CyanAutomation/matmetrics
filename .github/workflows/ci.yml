name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev
      - name: Build
        run: npm run build

  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install full dependencies (includes devDependencies)
        run: npm ci
      - name: Preflight tsx availability
        run: node -e "require.resolve('tsx')"
      - name: Validate plugin UI contract
        run: npm run validate:plugin-ui-contract
      - name: Run unit tests
        run: npm run test
      - name: Run full TypeScript test suite
        run: npm run test:all
      - name: Run contract checks
        run: npm run ci:contracts
