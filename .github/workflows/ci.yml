name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install full dependencies (includes devDependencies)
        run: npm ci
      - name: Validate repository skills
        run: npm run validate:skills
      - name: Test skill validator
        run: npm run test:skills
      - name: Lint
        run: npm run lint
      - name: Check workflow formatting
        run: npx prettier --check .github/workflows .github/dependabot.yml
      - name: Check theme contrast
        run: npm run validate:theme-contrast
      - name: Type check
        run: npm run typecheck
      - name: Run full TypeScript test suite
        run: npm run test:all
      - name: Run contract checks
        run: npm run ci:contracts
      - name: Check plugin maturity scorecards
        run: npm run plugin:maturity:check

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Go CLI
        run: go build ./go/cmd/matmetrics-cli
      - name: Run Go tests
        run: |
          go test -race -coverprofile=coverage.out ./internal/... ./go/... ./api/go/...
          go tool cover -func=coverage.out
      - name: Upload Go coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage-${{ github.sha }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  auth-worker:
    name: auth-worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/matmetrics-auth/package-lock.json
      - name: Install shared repository dependencies
        run: npm ci
      - name: Install auth Worker dependencies
        run: npm ci
        working-directory: workers/matmetrics-auth
      - name: Run auth Worker integration tests
        run: npm test
        working-directory: workers/matmetrics-auth
      - name: Type check auth Worker
        run: npm run typecheck
        working-directory: workers/matmetrics-auth

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Audit GitHub Actions workflows with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          version: v1.30.1
          advanced-security: false

  release-readiness:
    name: release-readiness
    if: always()
    needs:
      - build
      - quality
      - go
      - auth-worker
      - dependency-review
      - workflow-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Require deployment checks to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          GO_RESULT: ${{ needs.go.result }}
          AUTH_WORKER_RESULT: ${{ needs.auth-worker.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          for result in "$BUILD_RESULT" "$QUALITY_RESULT" "$GO_RESULT" "$AUTH_WORKER_RESULT" "$WORKFLOW_LINT_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required deployment check did not succeed."
              exit 1
            fi
          done

          if [[ "$EVENT_NAME" == "pull_request" && "$DEPENDENCY_REVIEW_RESULT" != "success" ]]; then
            echo "Dependency review must succeed for pull requests."
            exit 1
          fi

  release-please:
    name: Release Please
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - build
      - quality
      - go
      - auth-worker
      - workflow-lint
      - release-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Create or publish the release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
