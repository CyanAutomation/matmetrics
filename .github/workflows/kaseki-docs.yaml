name: Kaseki Docs Sweep

on:
  schedule:
    - cron: "0 5 * * 4"
  workflow_dispatch:

run-name: >-
  Docs sweep · ${{ github.repository }}@${{ github.sha }}

permissions:
  contents: read

# GitHub keeps one running and one pending run per group. A newer pending
# sweep replaces an older pending sweep, which is appropriate for this
# latest-main documentation task.
concurrency:
  group: kaseki-docs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  docs_sweep:
    name: Run Kaseki documentation sweep
    if: github.ref == 'refs/heads/main'
    environment: kaseki-agent
    runs-on: ubuntu-24.04
    timeout-minutes: 200

    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REF: ${{ github.sha }}
      TASK_DESCRIPTION: Keep README.md and docs/ accurate against the current implementation.
      ALLOWLIST: README.md,docs/**/*.md
      VALIDATION_COMMAND: "npm run test:all && npm run lint"

    steps:
      - name: Validate Kaseki configuration and required tools
        shell: bash
        run: |
          set -euo pipefail

          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"
          [[ "$KASEKI_BASE_URL" == "https://kaseki-tunnel.scheimann.xyz" ]] || {
            echo "::error title=Invalid Kaseki controller URL::Use the approved HTTPS controller URL."
            exit 1
          }

          for command_name in curl jq node; do
            command -v "$command_name" >/dev/null
          done

      - name: Check out the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify controller health
        uses: CyanAutomation/kaseki-agent/.github/actions/verify-controller-health@30db5d15e117b8d8de13eb66766d48cf6b7d618b
        with:
          base-url: ${{ vars.KASEKI_BASE_URL }}

      - name: Verify controller readiness
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 20 \
            --max-filesize 1048576 --output "$response_file" \
            "$KASEKI_BASE_URL/ready"
          jq -e '.status == "ready"' "$response_file" >/dev/null

      - name: Verify gateway connectivity and authentication
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 \
            --max-filesize 1048576 --output "$response_file" \
            --header "Authorization: Bearer $KASEKI_API_TOKEN" \
            "$KASEKI_BASE_URL/api/gateway-test?stage=1"
          jq -e '.status == "ok"' "$response_file" >/dev/null

      - name: Submit documentation sweep
        id: submit
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"

          idempotency_key="$(node scripts/kaseki-idempotency-key.mjs)"
          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg taskDescription "$TASK_DESCRIPTION" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              --arg idempotencyKey "$idempotency_key" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                idempotencyKey: $idempotencyKey,
                taskMode: "patch",
                publishMode: "draft_pr",
                timeoutSeconds: 10800,
                maxDiffBytes: 102400,
                scouting: { enabled: false },
                goalSetting: { enabled: false },
                goalCheck: { enabled: false },
                changedFilesAllowlist: (
                  $allowlist
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))
                ),
                validationCommands: [$validationCommand],
                taskPrompt: (
                  $taskDescription
                  + "\n\nPerform the documentation sweep for this repository. "
                  + "First read repository instructions, then inspect the current "
                  + "implementation and compare it against README.md and documentation "
                  + "under docs/. Update documentation only where inaccurate, incomplete, "
                  + "or stale. Do not modify application code, tests, configuration, "
                  + "dependencies, lockfiles, CI workflows, or generated files. "
                  + "Do not invent behavior. Avoid cosmetic rewrites. Before finishing, "
                  + "review the diff to confirm it contains documentation-only changes. "
                  + "If documentation is already accurate, make no changes and do not "
                  + "open a pull request."
                )
              }'
          )"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(
            curl --silent --show-error \
              --retry 3 --retry-all-errors \
              --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 \
              --max-filesize 1048576 --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST "$KASEKI_BASE_URL/api/runs" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$payload"
          )"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "::error title=Kaseki submission failed::Kaseki returned HTTP $http_status"
            echo "Kaseki returned HTTP \`$http_status\`. Response body omitted." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          run_id="$(jq -er '.id | strings | select(test("^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"))' "$response_file")"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Kaseki completion
        id: wait
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
          RUN_ID: ${{ steps.submit.outputs.run_id }}
        run: |
          set -euo pipefail
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"
          : "${RUN_ID:?Kaseki run ID is missing}"
          deadline=$((SECONDS + 11100))

          while (( SECONDS < deadline )); do
            response_file="$(mktemp)"
            trap 'rm -f "$response_file"' EXIT

            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 \
              --max-filesize 1048576 --output "$response_file" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              "$KASEKI_BASE_URL/api/runs/$RUN_ID/status"
            run_status="$(jq -er '.status | strings' "$response_file")"

            case "$run_status" in
              completed)
                exit_code="$(jq -er '.exitCode // 0 | numbers' "$response_file")"
                if [[ "$exit_code" == 0 ]]; then
                  printf 'status=completed\n' >> "$GITHUB_OUTPUT"
                  echo "Kaseki run $RUN_ID completed successfully."
                  exit 0
                fi
                printf 'status=failed (exit code %s)\n' "$exit_code" >> "$GITHUB_OUTPUT"
                echo "::error::Kaseki run $RUN_ID completed with exit code $exit_code."
                exit 1
                ;;
              failed|cancelled)
                printf 'status=%s\n' "$run_status" >> "$GITHUB_OUTPUT"
                echo "::error::Kaseki run $RUN_ID ended with status $run_status."
                exit 1
                ;;
              queued|running)
                echo "Kaseki run $RUN_ID is $run_status; checking again in 60 seconds."
                rm -f "$response_file"
                trap - EXIT
                sleep 60
                ;;
              *)
                printf 'status=unexpected\n' >> "$GITHUB_OUTPUT"
                echo "::error::Kaseki run $RUN_ID returned an unexpected status."
                exit 1
                ;;
            esac
          done

          printf 'status=timed out\n' >> "$GITHUB_OUTPUT"
          echo "::error::Kaseki run $RUN_ID did not complete within 185 minutes."
          exit 1

      - name: Publish run details
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id || 'not submitted' }}
          FINAL_STATUS: ${{ steps.wait.outputs.status || 'not completed' }}
        run: |
          {
            echo '## Kaseki documentation sweep'
            echo
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Repository | \`$REPO_URL\` |"
            echo "| Commit | \`$REF\` |"
            echo "| Allowed paths | \`$ALLOWLIST\` |"
            echo "| Validation | \`$VALIDATION_COMMAND\` |"
            echo "| Kaseki run | \`$RUN_ID\` |"
            echo "| Final status | \`$FINAL_STATUS\` |"
            echo
            echo 'Monitor Kaseki: https://kaseki-tunnel.scheimann.xyz/ui'
          } >> "$GITHUB_STEP_SUMMARY"
